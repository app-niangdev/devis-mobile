# Site nginx de la PWA gestionnaire : /etc/nginx/sites-available/app-devis.niangdev.com.
# Certificat gratuit : sudo certbot certonly --nginx -d app-devis.niangdev.com
server {
    listen 80;
    server_name app-devis.niangdev.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name app-devis.niangdev.com;

    ssl_certificate     /etc/letsencrypt/live/app-devis.niangdev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app-devis.niangdev.com/privkey.pem;

    # Contenu de mobile/build/web
    root /var/www/devis-pwa;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # Par défaut, revalidation à chaque ouverture (réponse 304 si rien n'a changé) :
    # les noms de fichiers Flutter ne sont pas versionnés, une mise à jour doit être vue tout de suite.
    add_header Cache-Control "no-cache" always;

    location = /manifest.json {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # Moteur graphique et icônes : ne changent qu'avec une mise à jour de Flutter ou du logo
    location ~ ^/(canvaskit|icons)/ {
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # APK Android (MOBILE_ANDROID_URL du backend) : copier build/app/outputs/flutter-apk/app-release.apk
    # en /var/www/devis-pwa/devis.apk. no-cache : toujours la dernière version publiée
    location = /devis.apk {
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="devis.apk"' always;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
