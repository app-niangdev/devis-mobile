<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- Remplacé par la valeur de `flutter build web --base-href` (doit commencer et finir par « / ») -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Créez, envoyez et suivez vos devis clients depuis votre téléphone.">

  <!-- Couleur de la barre d'état ; l'application l'adapte ensuite à la charte de l'entreprise -->
  <meta name="theme-color" content="#17202A">

  <!-- Installation sur l'écran d'accueil (Android et iPhone) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SN Devis">
  <meta name="application-name" content="SN Devis">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>SN Devis</title>

  <style>
    html, body { margin: 0; height: 100%; background: #FFFFFF; overscroll-behavior: none; }
    /* Écran de chargement affiché pendant le démarrage de Flutter */
    #splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      background: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity .35s ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #splash img {
      width: 96px; height: 96px;
      filter: drop-shadow(0 12px 22px rgba(0, 133, 63, .28));
      animation: pop .5s cubic-bezier(.2, .9, .3, 1.3) both;
    }
    #splash .name { color: #17202A; font-size: 22px; font-weight: 500; letter-spacing: .2px; }
    #splash .name b { color: #00853F; font-weight: 900; }
    #splash .bar { width: 120px; height: 4px; border-radius: 4px; background: #E4E9ED; overflow: hidden; }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 4px;
      background: linear-gradient(90deg, #00853F, #FDEF42);
      animation: load 1.1s ease-in-out infinite;
    }
    @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #splash img, #splash .bar::after { animation: none; } }
  </style>
</head>
<body>
  <div id="splash" aria-label="Chargement de SN Devis" role="progressbar">
    <img src="icons/Icon-192.png" alt="">
    <div class="name"><b>SN</b> Devis</div>
    <div class="bar"></div>
  </div>
  <script>
    // Retire l'écran de chargement dès la première image de l'application
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      splash.classList.add('hidden');
      setTimeout(function () { splash.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
